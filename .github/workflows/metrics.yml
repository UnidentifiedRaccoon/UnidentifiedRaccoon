name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"  # Каждый день в полночь UTC
  workflow_dispatch:  # Ручной запуск
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UnidentifiedRaccoon
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/Moscow
          filename: github-metrics.svg

          # Языки программирования
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Достижения (отключено из-за deprecation Projects Classic API)
          # plugin_achievements: yes
          # plugin_achievements_display: detailed
          # plugin_achievements_secrets: yes
          # plugin_achievements_threshold: C

          # Изокалендарь (коммиты)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Generate Compact Stats
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UnidentifiedRaccoon
          template: classic
          base: ""
          filename: github-metrics-compact.svg
          config_timezone: Europe/Moscow

          # Компактная статистика языков
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_threshold: 2%
